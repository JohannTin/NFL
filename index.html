    ? halfSpan
    : Math.max(...domain.map(v => Math.abs(v - mid)), probability ? .02 : 1);
  const x = v => 12 + (Math.max(-1, Math.min(1, (v - mid) / half)) + 1) / 2 * 216;
  const over = domain.filter(v => v - mid > half).length, under = domain.filter(v => mid - v > half).length;
  const fmt = v => probability ? fmtPct(v) : fmtPoint(v, signed);
  const label = r => r ? r[0] === r[1] ? fmt(r[0]) : `${fmt(r[0])}–${fmt(r[1])}` : "pending";
  const mine = values.filter(q => q.book === state.myBook).map(q => q[key]);
  const description = `Consensus ${fmt(mid)}. All books: ${label(a)} (${all.length}). `
    + `Sharp books: ${label(s)} (${sharp.length}). Model: ${hasModel ? fmt(model) : "pending"}.`
    + (state.myBook ? ` ${bookName(state.myBook)}: ${mine.length ? fmt(mine[0]) : "not offered"}.` : "");
  const tick = (v, book, height, color, opacity) => `<line x1="${x(v).toFixed(2)}" x2="${x(v).toFixed(2)}"
    y1="${(20 - height / 2).toFixed(2)}" y2="${(20 + height / 2).toFixed(2)}" stroke="${color}"
    stroke-width="${isSharp(book) ? 2 : 1.4}" stroke-linecap="round" opacity="${opacity}"/>`;
  /* Drawn in three passes so the marks you act on sit on top: the field, then
     the sharp books that set fair value, then the book you are actually betting.
     The last one is what turns this from "where is the market" into "am I on
     the good side of the model". */
  const isMine = book => book === state.myBook;
  const ticks = values.filter(q => !isSharp(q.book) && !isMine(q.book)).map(q => tick(q[key], q.book, 14, "var(--range)", .55)).join("")
    + values.filter(q => isSharp(q.book) && !isMine(q.book)).map(q => tick(q[key], q.book, 20, "var(--good)", .95)).join("")
    + values.filter(q => isMine(q.book)).map(q => `<rect class="mybook-tick" x="${(x(q[key]) - 2.5).toFixed(2)}" y="8" width="5" height="24" rx="1.5" fill="var(--accent, #1f6feb)" stroke="var(--surface)" stroke-width="1"><title>${esc(bookName(q.book))} ${fmt(q[key])}</title></rect>`).join("");
  /* Only a side that has quotes gets a label. "Sharp pending" is a placeholder
     that costs a line, and the labels have to stay one line tall down a column
     for the rows to read as rows. */
  const allLabel = a ? `<span>${compact ? "" : "All "}${label(a)}</span>` : "";
  const sharpLabel = !compact && s ? `<span class="sharp-text">Sharp ${label(s)}</span>` : "";
  const clamp = (count, side) => !count ? "" : `<polygon points="${side < 0 ? "10,20 16,15 16,25" : "230,20 224,15 224,25"}"
    fill="var(--range)" opacity=".8"><title>${count} beyond this scale</title></polygon>`;
  return `<div class="range-plot"><svg class="range-svg" viewBox="0 0 240 40" role="img" aria-label="${esc(description)}"><title>${esc(description)}</title>
    <line x1="12" x2="228" y1="20" y2="20" stroke="var(--track)" stroke-width="2"/>
    <line x1="120" x2="120" y1="8" y2="32" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="2 2"/>
    ${ticks}
    ${clamp(under, -1)}${clamp(over, 1)}
    ${hasModel ? `<circle class="model-dot" cx="${x(model).toFixed(2)}" cy="20" r="5" fill="var(--model)" stroke="var(--surface)" stroke-width="2"/>` : ""}
    </svg><div class="range-labels">${allLabel}${sharpLabel}</div></div>`;
}

/* ---------------------------------------------------------------- movement */

function sparkline(series) {
  const pts = series.filter(p => p.p_home != null);
  if (pts.length < 2) return `<div class="empty-note">One snapshot so far &mdash; movement needs a second fetch.</div>`;
  const W = 520, H = 190, PAD = { t: 18, r: 52, b: 26, l: 46 };
  const vals = pts.map(p => p.p_home);
  // A market that barely moved should read as barely moved, so the window never
  // narrows past a point - autoscaling a 0.1pt drift to full height would draw a
  // dramatic swing out of noise.
  const lo0 = Math.min(...vals), hi0 = Math.max(...vals);
  const mid = (hi0 + lo0) / 2, span = Math.max(hi0 - lo0, 0.02) * 1.6;
  const lo = mid - span / 2, hi = mid + span / 2;
  const startTime = new Date(pts[0].t).getTime(), endTime = new Date(pts[pts.length - 1].t).getTime();
  const x = i => PAD.l + (W - PAD.l - PAD.r) * (endTime > startTime
    ? (new Date(pts[i].t).getTime() - startTime) / (endTime - startTime) : i / (pts.length - 1));
  const y = v => PAD.t + (1 - (v - lo) / (hi - lo)) * (H - PAD.t - PAD.b);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.p_home).toFixed(1)}`).join("");
  const area = `M${x(0).toFixed(1)},${(H - PAD.b).toFixed(1)} ` +
    pts.map((p, i) => `L${x(i).toFixed(1)},${y(p.p_home).toFixed(1)}`).join(" ") +
    ` L${x(pts.length - 1).toFixed(1)},${(H - PAD.b).toFixed(1)} Z`;
  const dots = pts.map((p, i) =>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(p.p_home).toFixed(1)}" r="2.6" fill="var(--accent)"/>`).join("");
  const ticks = [hi, mid, lo].map(v => `
    <line x1="${PAD.l}" y1="${y(v).toFixed(1)}" x2="${W - PAD.r}" y2="${y(v).toFixed(1)}"
      stroke="var(--line)" stroke-dasharray="${Math.abs(v - mid) < 1e-9 ? "" : "3 3"}"/>
    <text x="${PAD.l - 8}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end"
      font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-dim)">${fmtPct(v)}</text>`).join("");
  const lastP = pts[pts.length - 1].p_home;
  return `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Consensus home win probability across ${pts.length} snapshots, now ${fmtPct(lastP)}">
    ${ticks}
    <path d="${area}" fill="var(--accent-soft)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text x="${W - PAD.r + 8}" y="${(y(lastP) + 4).toFixed(1)}" font-family="IBM Plex Mono, monospace"
      font-size="12" font-weight="600" fill="var(--accent)">${fmtPct(lastP)}</text>
    <text x="${PAD.l}" y="${H - 8}" font-family="IBM Plex Mono, monospace" font-size="10"
      fill="var(--ink-dim)">${clock(pts[0].t)}</text>
    <text x="${W - PAD.r}" y="${H - 8}" text-anchor="end" font-family="IBM Plex Mono, monospace"
      font-size="10" fill="var(--ink-dim)">${clock(pts[pts.length - 1].t)}</text>
  </svg>`;
}

function moveTable(g) {
  const first = g.movement[0] || {}, last = g.movement[g.movement.length - 1] || {};
  const rows = [
    ["Home win %", first.p_home, last.p_home, v => fmtPct(v), 1],
    ["Spread (home)", first.spread_home, last.spread_home, v => fmtPoint(v, true), 1],
    ["Total", first.total, last.total, v => fmtPoint(v), 1],
  ];
  return `<table class="movetable">
    <thead><tr><th>Consensus</th><th>First</th><th>Now</th><th>Move</th></tr></thead>
    <tbody>${rows.map(([label, a, b, fmt]) => {
      const d = (a == null || b == null) ? null : b - a;
      const cls = d == null || Math.abs(d) < 1e-9 ? "" : (d > 0 ? "delta up" : "delta down");
      const shown = d == null ? "&mdash;" : (Math.abs(d) < 1e-9 ? "flat"
        : (label === "Home win %" ? (d > 0 ? "+" : "") + (100 * d).toFixed(1) + "pt"
                                  : (d > 0 ? "+" : "") + d.toFixed(1)));
      return `<tr><td>${esc(label)}</td><td>${fmt(a)}</td><td>${fmt(b)}</td>
        <td class="${cls}">${shown}</td></tr>`;
    }).join("")}</tbody></table>`;
}

/* ------------------------------------------------------------- game lines */
function marketCards(g) {
  const metrics = [
    ["Home win probability", "p_home", fmtPct, "No-vig consensus", { probability: true }],
    ["Spread · home", "spread_home", v => fmtPoint(v, true), `${g.home_abbr} point spread`, { signed: true }],
    ["Total points", "total", fmtPoint, "Combined game total", {}],
  ];
  return `<section class="block"><div class="section-heading"><h3 class="blocktitle">Market overview</h3>${rangeLegend()}</div>
    <div class="market-grid">${metrics.map(([label, key, fmt, description, options]) => {
      const model = g.model?.[key] ?? null;
      const count = g.lines.filter(r => r[key] != null).length;
      return `<div class="market-card"><div class="market-label">${esc(label)}</div>
        <div class="market-value">${fmt(g.consensus[key])}</div><div class="market-description">${esc(description)}</div>
        ${rangeChart(g.lines, key, model, { ...options, center: g.consensus[key] })}
        <div class="range-meta"><span>${count} books quoting</span><span class="${model == null ? "" : "model-text"}">${model == null ? "Model pending" : `Model ${fmt(model)}`}</span></div></div>`;
    }).join("")}</div>
    <div class="model-status"><span>${g.model ? `Model as of ${fmtTime(g.model.updated)}` : "No matching game-model prediction yet"}</span></div></section>`;
}

/* Best available price per market. A spread or total price only means something
   next to the number it is attached to, so those are ranked among the books
   sitting on the modal line; a moneyline has no line to differ on. */
function topPrice(prices) {
  const decimals = prices.filter(v => v != null).map(americanToDecimal);
  return decimals.length ? Math.max(...decimals) : null;
}
function bestPrices(rows) {
  const modal = values => {
    const nums = values.filter(v => v != null);
    if (!nums.length) return null;
    const counts = new Map();
    nums.forEach(v => counts.set(v, (counts.get(v) || 0) + 1));
    return [...counts.entries()].sort((x, y) => y[1] - x[1] || x[0] - y[0])[0][0];
  };
  const top = topPrice;
  const spreadLine = modal(rows.map(r => r.spread_home)), totalLine = modal(rows.map(r => r.total));
  const atSpread = rows.filter(r => r.spread_home === spreadLine);
  const atTotal = rows.filter(r => r.total === totalLine);
  return {
    spreadLine, totalLine,
    spread_home_price: top(atSpread.map(r => r.spread_home_price)),
    total_over: top(atTotal.map(r => r.total_over)),
    total_under: top(atTotal.map(r => r.total_under)),
    ml_away: top(rows.map(r => r.ml_away)),
    ml_home: top(rows.map(r => r.ml_home)),
  };
}

function oddsCell(v, best, label = "") {
  const tag = label ? `<span class="odds-tag">${esc(label)}</span>` : "";
  if (v == null) return `<span class="odds empty">${tag}&mdash;</span>`;
  const isBest = best != null && americanToDecimal(v) === best;
  return `<span class="odds${isBest ? " best" : ""}"${isBest ? ' title="Best available price"' : ""}>${tag}${fmtOdds(v)}</span>`;
}

/* A cell in the shape the props board uses: the number being bet on the left,
   dim, and the price beside it, so the decimals stack down a column on the
   game lines tab exactly as they do under Over and Under. */
function boardCell(point, signed, price, best) {
  /* The line slot is kept even for a market that has no line, so a moneyline
     price sits at the same offset in its cell as a spread price does in its. */
  const line = `<span class="ou-line">${point == null ? "" : fmtPoint(point, signed)}</span>`;
  return `<td class="ou-cell${price == null ? " empty" : ""}"><span class="ou-in">${line}${oddsCell(price, best)}</span></td>`;
}

function linesTable(g) {
  if (!g.lines.length) return `<div class="nodata"><strong>Game lines pending</strong>This matchup is on the schedule. Quotes will appear after collection.</div>`;
  const selected = g.lines.filter(r => state.bookFilter !== "sharp" || isSharp(r.book));
  const best = bestPrices(selected);
  /* Total is split into its two sides rather than stacked in one cell, so the
     over and the under line up under their own headings the way they do on the
     props board instead of sharing a column. */
  const rows = [...selected].sort((a, b) => Number(isPrimary(b.book)) - Number(isPrimary(a.book)) || Number(isSharp(b.book)) - Number(isSharp(a.book)) || bookName(a.book).localeCompare(bookName(b.book))).map(r => `<tr class="ou-row${isPrimary(r.book) ? " primary-book" : ""}">
    <td class="ou-player"><div class="ou-player-in"><span class="ou-name">
      <span class="pname">${esc(r.title || r.book)}${isPrimary(r.book) ? '<span class="primary-badge">MY BOOK</span>' : ""}${isSharp(r.book) ? '<span class="sharp-badge">SHARP</span>' : ""}</span></span></div></td>
    ${boardCell(r.spread_home, true, r.spread_home_price, r.spread_home === best.spreadLine ? best.spread_home_price : null)}
    ${boardCell(r.total, false, r.total_over, r.total === best.totalLine ? best.total_over : null)}
    ${boardCell(r.total, false, r.total_under, r.total === best.totalLine ? best.total_under : null)}
    ${boardCell(null, false, r.ml_away, best.ml_away)}
    ${boardCell(null, false, r.ml_home, best.ml_home)}
    <td class="c-num strong"${r.updated ? ` title="Updated ${esc(fmtTime(r.updated))}"` : ""}>${fmtPct(r.p_home)}</td>
  </tr>`).join("");
  return `<div class="section-heading"><h3 class="blocktitle">Game lines</h3></div>
    <div class="propcontrols"><div class="mybook-select"><label for="book-filter">Books</label>
      <select id="book-filter" aria-label="Filter game line books"><option value="all">All books (${g.lines.length})</option>
      <option value="sharp" ${state.bookFilter === "sharp" ? "selected" : ""}>Sharp books (${g.lines.filter(r => isSharp(r.book)).length})</option></select>
      <span class="hint">My book first, then sharp books</span></div></div>
    <div class="tablewrap"><table class="lines-table"><caption class="sr-only">Game lines by sportsbook for ${esc(g.label)}</caption>
    <thead><tr><th scope="col">Book</th><th scope="col" class="ou-head">Spread</th>
      <th scope="col" class="ou-head">Total over</th><th scope="col" class="ou-head">Total under</th>
      <th scope="col" class="ou-head">${esc(g.away_abbr)} ML</th><th scope="col" class="ou-head">${esc(g.home_abbr)} ML</th>
      <th scope="col" class="c-num">Home no-vig</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="7" class="empty-note">No sharp quotes available.</td></tr>'}</tbody></table></div>`;
}

/* ----------------------------------------------------------------- props */
/* The offer you can actually take at the selected book, and what it is worth.
   Side is chosen rather than shown twice: a line is two different bets, and the
   one worth surfacing is whichever the model prices above its price. EV needs a
   two-way pair - a lone over is the book's hold, not an opinion - so an
   unpaired quote yields a price but no EV. */
function myOffer(p) {
  const quote = p.quotes.find(q => q.book === state.myBook);
  if (!quote) return null;
  const model = p.model?.p_over ?? null;
  const yesNo = quote.point == null;
  const sides = [
    { side: yesNo ? "Yes" : "Over", price: quote.over, p: model },
    { side: yesNo ? "No" : "Under", price: quote.under, p: model == null ? null : 1 - model },
  ].filter(x => x.price != null);
  if (!sides.length) return null;
  for (const x of sides) x.ev = (x.p == null || quote.under == null || quote.over == null)
    ? null : x.p * toDecimal(x.price) - 1;
  const scored = sides.filter(x => x.ev != null);
  const best = scored.length ? scored.reduce((a, b) => b.ev > a.ev ? b : a) : sides[0];
  return { ...best, point: quote.point, translated: !!p.model?.translated };
}

function toDecimal(american) {
  const v = Number(american);
  return v > 0 ? 1 + v / 100 : 1 + 100 / Math.abs(v);
}

function propsTable(g) {
  /* With a book selected, the board is read against it - a market that book
     does not price is not "empty", it is not on offer, and showing an
     all-dashes block for it is noise, so markets and rows are filtered to
     what is actually bettable there. With no book selected, every offered
     market/row shows instead, priced at each row's best available side
     rather than one book's, and EV/stake highlighting is switched off since
     that needs one specific priced offer to compare against. */
  const offeredIn = m => (g.props[m] || []).filter(p => !state.myBook || p.quotes.some(q => q.book === state.myBook));
  const markets = Object.keys(DATA.prop_markets).filter(m => offeredIn(m).length);
  if (!markets.length) return state.myBook
    ? `<div class="nodata"><strong>Nothing offered at ${esc(bookName(state.myBook))}</strong>This book prices none of the player markets in the latest snapshot. Choose another book above.</div>`
    : `<div class="nodata"><strong>No player props yet</strong>Quotes will appear here once books post them.</div>`;
  const selected = state.market === "all" ? "all" : markets.includes(state.market) ? state.market : markets[0];
  const active = selected === "all" ? markets : [selected];
  const chips = ["all", ...markets].map(m => `<button class="mchip ${selected === m ? "active" : ""}"
    data-mkt="${esc(m)}" aria-pressed="${selected === m}">${m === "all" ? "All markets" : esc(DATA.prop_markets[m])}<span class="count">${m === "all" ? markets.reduce((n, k) => n + offeredIn(k).length, 0) : offeredIn(m).length}</span></button>`).join("");
  const body = active.map(m => {
    const head = `<tr class="mkt-head"><td colspan="8">${esc(DATA.prop_markets[m])} <span class="mkt-sub">O/U</span></td></tr>`;
    // One scale per market, so every player's row in it can be read against the rest.
    const lineSpan = sharedSpan(offeredIn(m).flatMap(p =>
      p.point == null ? [] : p.quotes.map(q => q.point == null ? null : q.point - p.point)), 1);
    const probSpan = sharedSpan(offeredIn(m).flatMap(p =>
      p.p_over == null ? [] : p.quotes.filter(q => q.point === p.point).map(q => q.p_over == null ? null : q.p_over - p.p_over)), .01);
    const rows = offeredIn(m).map(p => {
      const key = m + "|" + p.player;
      const quotesAtLine = p.quotes.filter(q => q.point === p.point);
      const probability = p.model?.p_over ?? null;
      const delta = probability == null || p.p_over == null ? null : (probability - p.p_over) * 100;
      // Over/under prices only compare between books on the same number, so the
      // best-price marks are ranked among quotes at the displayed line only.
      const bestOver = topPrice(quotesAtLine.map(q => q.over));
      const bestUnder = topPrice(quotesAtLine.map(q => q.under));
      const yesNo = p.point == null;
      let lastBook = null;
      const bookRows = state.open[key] ? [...p.quotes].sort((a, b) => Number(isPrimary(b.book)) - Number(isPrimary(a.book)) || Number(isSharp(b.book)) - Number(isSharp(a.book)) || a.book.localeCompare(b.book) || (a.point ?? 0) - (b.point ?? 0)).map(q => {
        const repeat = q.book === lastBook;
        lastBook = q.book;
        const atLine = q.point === p.point;
        const name = repeat ? `<span class="sr-only">${esc(bookName(q.book))}</span>`
          : `${esc(bookName(q.book))}${isPrimary(q.book) ? '<span class="primary-badge">MY BOOK</span>' : ""}${isSharp(q.book) ? '<span class="sharp-badge">SHARP</span>' : ""}`;
        return `<tr class="bookrow ${repeat ? "samebook" : ""}">
        <td class="bookname">${name}${q.point !== p.point ? ' <span class="altline">ALT</span>' : ""}
          <span class="ou-meta">${q.point == null ? "Yes/No" : fmtPoint(q.point)}${q.p_over == null ? "" : ` · ${fmtPct(q.p_over)} no-vig`}</span></td>
        <td class="c-num"><span class="nbooks">${q.point == null ? "" : fmtPoint(q.point)}</span></td>
        <td class="c-num">${oddsCell(q.over, atLine ? bestOver : null, yesNo ? "Y" : "O")}</td>
        <td class="c-num">${oddsCell(q.under, atLine ? bestUnder : null, yesNo ? "N" : "U")}</td>
        <td colspan="4" class="c-num"><span class="nbooks">${fmtTime(q.updated)}</span></td></tr>`;
      }).join("") : "";
      /* bet365's own shape: the player on the left, Over and Under as two
         mirrored cells each carrying its line and price. Both sides are shown
         rather than the better one, because a board you read against your own
         book has to let you see the side you are not being offered value on.
         With no book selected, "anchor" is the best price on each side at the
         displayed line instead of one book's paired quote, and EV is switched
         off - a best-over and a best-under can come from different books, so
         they are not one offer to price. */
      const mine = state.myBook ? (p.quotes.find(q => q.book === state.myBook) || null) : null;
      const anchor = mine || (state.myBook ? null
        : (bestOver != null || bestUnder != null ? { point: p.point, over: bestOver, under: bestUnder } : null));
      const model = p.model?.p_over ?? null;
      const paired = mine && mine.over != null && mine.under != null;
      const cell = (label, price, probability) => {
        if (!anchor || price == null) return `<td class="ou-cell empty" data-label="${label}"><span class="nbooks">&mdash;</span></td>`;
        const ev = state.myBook && paired && probability != null ? probability * toDecimal(price) - 1 : null;
        const stakeable = ev != null && ev >= (DATA.ev_floor ?? .02) && !p.model?.translated;
        return `<td class="ou-cell ${stakeable ? "ou-bet" : ""}" data-label="${label}">
          <span class="ou-line">${anchor.point == null ? "" : fmtPoint(anchor.point)}</span>
          <span class="ou-price">${fmtOdds(price)}</span>
          ${ev == null ? "" : `<span class="ou-ev ${ev > 0 ? "ev-pos" : "ev-neg"}">${ev > 0 ? "+" : ""}${(100 * ev).toFixed(1)}%${stakeable ? '<span class="primary-badge">BET</span>' : ""}</span>`}</td>`;
      };
      return `<tr class="playerrow ou-row ${state.open[key] ? "open" : ""}">
        <td class="ou-player"><div class="ou-player-in">
          <span class="ou-name"><span class="pname">${esc(p.player)}</span>
            <span class="ou-meta">${esc([p.team, p.position].filter(Boolean).join(" · "))}</span></span></div></td>
        <td class="c-num strong" data-label="Line / range">${p.point == null ? '<span class="nbooks">Yes/No</span>'
          : `${fmtPoint(p.point)}<div class="line-range">${rangeChart(p.quotes, "point", null, { compact: true, center: p.point, halfSpan: lineSpan })}</div>`}</td>
        ${cell(yesNo ? "Yes" : "Over", anchor?.over, model)}
        ${cell(yesNo ? "No" : "Under", anchor?.under, model == null ? null : 1 - model)}
        <td class="c-num" data-label="Fair">${model == null ? '<span class="nbooks">&mdash;</span>'
          : `<span class="model-text" title="${esc(`Model ${fmtPct(model)} over${p.model?.translated ? ` · translated from line ${p.model.from_line}` : ""} · anchor ${bookName(p.model.book)}`)}">${fmtPct(model)}${p.model?.translated ? '<span class="approx">~</span>' : ""}</span>`}</td>
        <td class="c-num" data-label="No-vig">${fmtPct(p.p_over)}
          ${delta == null ? "" : `<span class="ou-meta">${delta > 0 ? "+" : ""}${delta.toFixed(1)} pp</span>`}</td>
        <td class="c-bar" data-label="Probability range">${rangeChart(quotesAtLine, "p_over", model, { probability: true, center: p.p_over, halfSpan: probSpan })}</td>
        <td class="c-num ou-expand"><button class="expand" data-key="${esc(key)}" aria-expanded="${!!state.open[key]}"
          aria-label="${state.open[key] ? "Hide" : "Show"} ${esc(p.player)} ${esc(DATA.prop_markets[m])} book quotes">${state.open[key] ? "\u2212" : p.quotes.length + " +"}</button></td>
      </tr>${state.open[key] ? `<tr class="model-note"><td colspan="8">
        ${model == null ? "No model price for this line." : `Model ${fmtPct(model)} over · sharp anchor ${esc(bookName(p.model.book))} · ${fmtTime(p.model.updated)}${p.model.translated ? ` · translated from line ${p.model.from_line}` : ""}`}</td></tr>` : ""}${bookRows}`;
    }).join("");
    return head + rows;
  }).join("");
  return `<div class="section-heading"><h3 class="blocktitle">Player props</h3></div>
    <div class="propcontrols">${rangeLegend()}</div>
    <div class="marketchips">${chips}</div>
    <div class="tablewrap"><table class="props-table"><caption class="sr-only">${state.myBook ? `Player props priced against ${esc(bookName(state.myBook))}` : "Player props, best available price per side"} for ${esc(g.label)}</caption>
      <thead><tr><th scope="col">Player</th>
        <th scope="col" class="c-num">Line / range</th>
        <th scope="col" class="c-num ou-head">Over</th><th scope="col" class="c-num ou-head">Under</th>
        <th scope="col" class="c-num">Fair</th><th scope="col" class="c-num">No-vig</th>
        <th scope="col">Probability range</th>
        <th scope="col"><span class="sr-only">Book details</span></th></tr></thead>
      <tbody>${body || '<tr><td colspan="8"><div class="empty-note">All markets are hidden. Select a market above to show players.</div></td></tr>'}</tbody></table></div>`;
}

/* ----------------------------------------------------------------- edges */
/* Offers the prop model prices above the book. EV is per side, so a market can
   appear on the under and not the over. Books that feed the model's own
   reference are excluded upstream in dashboard.py - an "edge" against the book
   that defined fair value is not an edge. */
function edgesTable(g) {
  if (!g.edges || !g.edges.length) return `<div class="nodata"><strong>No +EV offers</strong>The prop model prices every quoted offer at or below its book. This is the expected result most of the time.</div>`;
  const rows = g.edges.map(e => `<tr class="${e.pick_grade ? "edge-pick" : ""}">
    <td><span class="pname">${esc(e.player)}</span>${e.pick_grade ? `<span class="primary-badge" title="${e.coach_reviewed ? 'Selected after football review' : 'Taken by the model selector'}">PICK</span>` : ""}</td>
    <td>${esc(DATA.prop_markets[e.market] || e.market)}</td>
    <td class="c-num">${esc(e.side)} ${fmtPoint(e.point)}</td>
    <td>${esc(bookName(e.book))}${isPrimary(e.book) ? '<span class="primary-badge">MY BOOK</span>' : ""}</td>
    <td class="c-num"><span class="odds">${fmtOdds(e.odds)}</span></td>
    <td class="c-num">${fmtPct(e.p_model)}</td>
    <td class="c-num edge-ev">+${(100 * e.ev).toFixed(2)}%${e.translated ? '<span class="approx" title="Model priced at a different line and carried across">~</span>' : ""}</td></tr>`).join("");
  return `<div class="section-heading"><h3 class="blocktitle">Model edges</h3>
    <span class="hint"><span class="approx">~</span> = model translated from a different line</span></div>
    <div class="tablewrap"><table class="edges-table"><caption class="sr-only">Positive expected value prop offers for ${esc(g.label)}</caption>
    <thead><tr><th>Player</th><th>Market</th><th>Bet</th><th>Book</th><th class="c-num">Odds</th><th class="c-num">Model</th><th class="c-num">EV</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ------------------------------------------------------------------ picks */
/* All offers the selector actually took, with the hand-written
   case for each one underneath it.

   Every number on this panel comes from the edge rows, and every sentence
   comes from writeups/<game_id>.json. Keeping the split that way is the whole
   point: a rebuild reprices the bets from the newest snapshot, and prose
   cannot reprice itself. The builder matches the file against the live picks
   before it ships one, so a writeup that argues for bets the model has since
   dropped arrives with `stale` set and its paragraphs withheld rather than
   printed under numbers they were never about. */
const pickKey = e => [e.player, e.market, Number(e.point).toFixed(1), e.side, e.book].join("|");

function paragraphs(body) {
  return (body || []).map(t => `<p>${esc(t)}</p>`).join("");
}

function pickCard(e, note) {
  const label = DATA.prop_markets[e.market] || e.market;
  return `<article class="pick">
    <header class="pick-head">
      <div class="pick-bet">
        <span class="pick-player">${esc(e.player)}</span>
        <span class="pick-line">${esc(label)} &middot; <strong>${esc(e.side)} ${fmtPoint(e.point)}</strong></span>
        <span class="pick-book">${esc(bookName(e.book))}${isPrimary(e.book) ? '<span class="primary-badge">MY BOOK</span>' : ""}</span>
      </div>
      <dl class="pick-nums">
        <div><dt>Price</dt><dd class="odds">${fmtOdds(e.odds)}</dd></div>
        <div><dt>Model</dt><dd class="model-text">${fmtPct(e.p_model)}</dd></div>
        <div><dt>EV</dt><dd class="edge-ev">+${(100 * e.ev).toFixed(2)}%</dd></div>
        <div><dt>Stake</dt><dd>${e.stake == null ? "&mdash;" : Number(e.stake).toFixed(1) + "u"}</dd></div>
      </dl>
    </header>
    ${note ? `${note.angle ? `<p class="pick-angle">${esc(note.angle)}</p>` : ""}
      <div class="pick-body">${paragraphs(note.body)}</div>` : ""}</article>`;
}

function researchPickCard(pick) {
  const label = DATA.prop_markets[pick.market] || pick.market;
  return `<article class="pick research-pick">
    <header class="pick-head">
      <div class="pick-bet">
        <span class="pick-player">${esc(pick.player)} <span class="primary-badge">RESEARCH PICK</span></span>
        <span class="pick-line">${esc(label)} &middot; <strong>${esc(pick.side)} ${fmtPoint(pick.point)}</strong></span>
        <span class="pick-book">${esc(bookName(pick.book))} reference</span>
      </div>
      <dl class="pick-nums">
        <div><dt>Reference price</dt><dd class="odds">${fmtOdds(pick.odds)}</dd></div>
        <div><dt>Model</dt><dd class="model-text">&mdash;</dd></div>
        <div><dt>EV</dt><dd>&mdash;</dd></div>
        <div><dt>Stake</dt><dd>${pick.stake == null ? "&mdash;" : Number(pick.stake).toFixed(1) + "u"}</dd></div>
      </dl>
    </header>
    ${pick.angle ? `<p class="pick-angle">${esc(pick.angle)}</p>` : ""}
    <div class="pick-body">${paragraphs(pick.body)}</div>
  </article>`;
}

function picksSection(g) {
  const picks = (g.edges || []).filter(e => e.pick_grade);
  if (g.coach_review?.stale) return `<div class="nodata"><strong>Review needed</strong>${esc(g.coach_review.stale)}</div>`;
  const reviewed = Boolean(g.coach_review);
  if (!picks.length && !reviewed && g.picks_status?.message) {
    return `<div class="nodata"><strong>New picks withheld</strong>${esc(g.picks_status.message)}
      <p>${esc(g.picks_status.paired_bet365_offers)} paired Bet365 offers; ${esc(g.picks_status.exact_api_matches)} exact API-line matches.</p></div>`;
  }
  if (!picks.length && !reviewed) return `<div class="nodata"><strong>No picks in this game</strong>The selector took nothing here. Offers over the EV floor, if there are any, are listed under +EV bets with the reason each one was passed.</div>`;
  const note = g.writeup;
  const bodies = (note && !note.stale) ? note.picks : {};
  const researchPicks = (note && !note.stale) ? (note.research_picks || []) : [];
  if (reviewed) {
    const order = Object.keys(bodies);
    picks.sort((a, b) => order.indexOf(pickKey(a)) - order.indexOf(pickKey(b)));
  }
  const cards = picks.map(e => pickCard(e, bodies[pickKey(e)])).join("")
    + researchPicks.map(researchPickCard).join("");
  const intro = note && !note.stale && (note.headline || note.standfirst)
    ? `<div class="writeup-lede">${note.headline ? `<h4>${esc(note.headline)}</h4>` : ""}
       ${note.standfirst ? `<p>${esc(note.standfirst)}</p>` : ""}
       ${note.written_at ? `<p class="pick-locked-at">Locked ${fmtTime(note.written_at)}</p>` : ""}</div>` : "";
  const sections = note && !note.stale
    ? (note.sections || []).filter(x => x.title !== "Evidence and limits" && x.title !== "Sources").map(x => `<section class="writeup-block">
        ${x.title ? `<h4>${esc(x.title)}</h4>` : ""}${paragraphs(x.body)}</section>`).join("") : "";
  /* Two states share one banner: no file at all, and a file that no longer
     describes these bets. Both mean the same thing to a reader - the bets are
     current and the reasoning is not on the page. */
  const banner = !note
    ? `<div class="writeup-flag">No writeup for this game. The bets above are the selector's; the reasoning has not been written up.</div>`
    : note.stale ? `<div class="writeup-flag">${esc(note.stale)}</div>` : "";
  const pass = reviewed && !picks.length ? '<p class="writeup-flag"><strong>Pass the +EV board</strong></p>' : "";
  return `<div class="section-heading"><h3 class="blocktitle">Picks</h3></div>
    <div class="picks-panel">${intro}${pass}<div class="picklist">${cards}</div>${sections}${banner}</div>`;
}

/* ------------------------------------------------------- prop movement feed */
/* A feed, not a leaderboard: before kickoff the useful question is "what just
   moved", so this is the most recent changes newest-first rather than the
   biggest movers since open. Measured on the sharp devigged probability, with
   a line change emitted as its own event - 6.5 and 5.5 receptions are
   different bets, not two points on one curve. */
function propMoveTable(g) {
  const feed = g.prop_movement || [];
  if (!feed.length) return `<div class="nodata"><strong>No prop movement yet</strong>Movement needs at least two snapshots carrying the same player market. Keep the collector running.</div>`;
  const rows = feed.map(e => {
    const line = e.kind === "line";
    const dir = line ? "" : e.delta > 0 ? "up" : "down";
    const change = line
      ? `<span class="move-line">${fmtPoint(e.from)} &rarr; ${fmtPoint(e.to)}</span>`
      : `${fmtPct(e.from)} &rarr; ${fmtPct(e.to)}`;
    const amount = line
      ? `<span class="tag-line">LINE</span>`
      : `<span class="delta ${dir}">${e.delta > 0 ? "+" : ""}${(100 * e.delta).toFixed(1)}pp</span>`;
    return `<tr>
      <td class="c-num"><span class="nbooks">${fmtTime(e.at)}</span></td>
      <td><span class="pname">${esc(e.player)}</span></td>
      <td>${esc(DATA.prop_markets[e.market] || e.market)}${line || e.line == null ? "" : ` <span class="nbooks">${fmtPoint(e.line)}</span>`}</td>
      <td class="c-num">${change}</td>
      <td class="c-num">${amount}</td></tr>`;
  }).join("");
  return `<div class="section-heading"><h3 class="blocktitle">Latest prop moves</h3></div>
    <div class="tablewrap"><table class="movetable"><caption class="sr-only">Most recent player prop moves for ${esc(g.label)}</caption>
    <thead><tr><th scope="col" class="c-num">When</th><th scope="col">Player</th><th scope="col">Market</th>
      <th scope="col" class="c-num">Change</th><th scope="col" class="c-num">Move</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ---------------------------------------------------------------- detail */
function gamePanel(g) {
  if (state.tab === "lines") return linesTable(g);
  if (state.tab === "edges") return edgesTable(g);
  if (state.tab === "picks") return picksSection(g);
  if (state.tab === "movement") {
    const props = (g.prop_movement || []).length;
    const view = state.moveView === "props" && props ? "props" : "game";
    const toggle = `<div class="moveswitch" role="tablist" aria-label="Movement view">
      <button class="mchip ${view === "game" ? "active" : ""}" data-move="game" aria-pressed="${view === "game"}">Game lines<span class="count">${g.snapshots}</span></button>
      <button class="mchip ${view === "props" ? "active" : ""}" data-move="props" aria-pressed="${view === "props"}" ${props ? "" : "disabled"}>Player props<span class="count">${props}</span></button></div>`;
    if (view === "props") return toggle + propMoveTable(g);
    return `${toggle}<div class="section-heading"><h3 class="blocktitle">Home win probability over time</h3></div>
      <div class="movegrid"><div class="chartcard">${sparkline(g.movement)}</div>
      <div class="tablewrap">${moveTable(g)}</div></div>`;
  }
  return propsTable(g);
}

function wireGamePanel(g) {
  const panel = el("game-panel");
  panel.querySelectorAll("[data-mkt], [data-key]").forEach(button => button.addEventListener("click", () => {
    const attr = button.hasAttribute("data-mkt") ? "data-mkt" : "data-key";
    const value = button.getAttribute(attr);
    if (attr === "data-mkt") state.market = value;
    else state.open[value] = !state.open[value];
    panel.innerHTML = gamePanel(g); wireGamePanel(g);
    [...panel.querySelectorAll(`[${attr}]`)].find(b => b.getAttribute(attr) === value)?.focus({ preventScroll: true });
  }));
  panel.querySelectorAll("[data-move]").forEach(button => button.addEventListener("click", () => {
    state.moveView = button.getAttribute("data-move");
    panel.innerHTML = gamePanel(g); wireGamePanel(g);
  }));
  el("book-filter")?.addEventListener("change", event => {
    state.bookFilter = event.target.value; panel.innerHTML = gamePanel(g); wireGamePanel(g);
    el("book-filter").focus({ preventScroll: true });
  });
}

function renderGameDetail() {
  const games = weekGames();
  const g = games.find(x => x.id === state.game) || games[0];
  if (!g) {
    el("detail").innerHTML = '<div class="nodata"><strong>No games available</strong>Choose another week to view the board.</div>';
    return;
  }
  state.game = g.id;
  const props = Object.values(g.props).flat().length;
  const researchPickCount = g.writeup && !g.writeup.stale ? (g.writeup.research_picks || []).length : 0;
  const tabs = [["props", "Player props", props], ["lines", "Game lines", g.lines.length], ["movement", "Movement", g.snapshots],
    ["edges", "+EV bets", (g.edges || []).length],
    ["picks", "Picks", (g.edges || []).filter(e => e.pick_grade).length + researchPickCount]];
  el("detail").innerHTML = `${teamAccent(g)}<div class="gamehead"><div>
    <div class="eyebrow">${esc(g.season || DATA.season)} regular season ${g.week ? ` / Week ${g.week}` : ""}</div>
    <h2>${teamLogo(g.away_abbr)}${esc(g.away)} <span>at</span> ${teamLogo(g.home_abbr)}${esc(g.home)}</h2>
    <div class="sub">${esc(dayLabel(g.kickoff))} · ${clock(g.kickoff)} <span class="hint">local</span></div></div>
    <div class="chips"><span class="metachip">${g.last_seen ? `Board as of ${fmtTime(g.last_seen)}` : "Awaiting first snapshot"}</span></div></div>
    ${marketCards(g)}
    <div class="tabs" role="tablist" aria-label="Game market details">${tabs.map(([id, label, count]) => `<button role="tab" class="tab ${state.tab === id ? "active" : ""}"
      id="tab-${id}" data-tab="${id}" aria-controls="game-panel" aria-selected="${state.tab === id}" tabindex="${state.tab === id ? 0 : -1}">${label}<span class="count">${count}</span></button>`).join("")}</div>
    <section id="game-panel" role="tabpanel" aria-labelledby="tab-${state.tab}" tabindex="0">${gamePanel(g)}</section>`;
  const tabButtons = [...el("detail").querySelectorAll("[data-tab]")];
  const selectTab = button => {
    state.tab = button.dataset.tab;
    tabButtons.forEach(tab => {
      const active = tab === button;
      tab.classList.toggle("active", active); tab.setAttribute("aria-selected", active); tab.tabIndex = active ? 0 : -1;
    });
    el("game-panel").setAttribute("aria-labelledby", button.id);
    el("game-panel").innerHTML = gamePanel(g); wireGamePanel(g);
  };
  tabButtons.forEach((button, index) => {
    button.addEventListener("click", () => selectTab(button));
    button.addEventListener("keydown", event => {
      const next = event.key === "ArrowRight" ? (index + 1) % tabs.length : event.key === "ArrowLeft" ? (index + tabs.length - 1) % tabs.length : event.key === "Home" ? 0 : event.key === "End" ? tabs.length - 1 : null;
      if (next == null) return;
      event.preventDefault(); selectTab(tabButtons[next]); tabButtons[next].focus();
    });
  });
  wireGamePanel(g);
  document.title = `${g.label} · TinAlgo`;
}

/* ----------------------------------------------------------------- render */

function render() {
  const games = weekGames();
  if (!games.some(g => g.id === state.game)) state.game = games[0]?.id || null;
  renderNav();
  renderSummary();
  renderGameDetail();
}

el("search").addEventListener("input", renderNav);
el("search").addEventListener("keydown", event => {
  if (event.key === "Escape") { el("search").value = ""; renderNav(); }
  if (event.key === "Enter" && visibleGames().length) {
    state.game = visibleGames()[0].id; state.open = {}; render(); el("detail").focus();
  }
});
document.addEventListener("keydown", event => {
  if (event.key === "/" && !event.metaKey && !event.ctrlKey && !event.altKey && !event.target.matches("input, select, textarea, [contenteditable]")) {
    event.preventDefault(); el("search").focus();
  }
});
const weeks = [...new Set(DATA.games.map(g => g.week).filter(w => w != null))].sort((a, b) => a - b);
const scheduledGames = DATA.games.filter(g => g.kickoff && !isNaN(new Date(g.kickoff)));
const upcomingGames = scheduledGames.filter(g => new Date(g.kickoff).getTime() >= Date.now())
  .sort((a, b) => new Date(a.kickoff) - new Date(b.kickoff));
const latestGames = [...scheduledGames].sort((a, b) => new Date(b.kickoff) - new Date(a.kickoff));
const activeGame = upcomingGames[0] || latestGames[0];
state.week = activeGame?.week != null ? String(activeGame.week) : weeks.length ? String(weeks[0]) : "all";

const params = new URLSearchParams(location.search);
const requestedWeek = params.get("week");
if (requestedWeek === "all" || weeks.some(w => String(w) === requestedWeek)) state.week = requestedWeek;
const requestedGameId = params.get("game");
const requestedGame = DATA.games.find(g => g.game_id === requestedGameId || g.id === requestedGameId);
if (requestedGame) {
  state.week = String(requestedGame.week);
  state.game = requestedGame.id;
}
const requestedTab = params.get("tab");
if (["props", "lines", "movement", "edges", "picks"].includes(requestedTab)) state.tab = requestedTab;
el("week-select").innerHTML = weeks.map(w => `<option value="${w}">Week ${w}</option>`).join("") + '<option value="all">All collected</option>';
el("week-select").value = state.week;
el("seasonLabel").textContent = `${DATA.season} season`;
el("week-select").addEventListener("change", event => {
  state.week = event.target.value; state.open = {}; el("search").value = ""; render();
});
const allBooks = [...new Set(DATA.games.flatMap(g => Object.values(g.props).flat().flatMap(p => p.quotes.map(q => q.book))))].sort();
el("mybook").innerHTML = '<option value="">No book selected</option>'
  + allBooks.map(b => `<option value="${esc(b)}">${esc(bookName(b))}</option>`).join("");
el("mybook").value = state.myBook;
el("mybook").addEventListener("change", event => { state.myBook = event.target.value; render(); });
function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  el("theme-toggle").setAttribute("aria-label", `Switch to ${theme === "dark" ? "light" : "dark"} theme`);
  el("theme-toggle").setAttribute("aria-pressed", theme === "dark");
  try { localStorage.setItem("nfl-board-theme", theme); } catch (_) { /* File viewers may disallow storage. */ }
}
let theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { theme = localStorage.getItem("nfl-board-theme") || theme; } catch (_) { /* Use system preference. */ }
setTheme(theme === "dark" ? "dark" : "light");
el("theme-toggle").addEventListener("click", () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
function setOddsFormat(format) {
  state.oddsFormat = format;
  const button = el("odds-format");
  button.textContent = format === "decimal" ? "Decimal" : "American";
  button.setAttribute("aria-pressed", format === "decimal");
  button.setAttribute("aria-label", `Switch to ${format === "decimal" ? "American" : "decimal"} odds`);
  try { localStorage.setItem("nfl-board-odds-format", format); } catch (_) { /* File viewers may disallow storage. */ }
}
let oddsFormat = "decimal";
try { oddsFormat = localStorage.getItem("nfl-board-odds-format") || oddsFormat; } catch (_) { /* Use default. */ }
setOddsFormat(oddsFormat === "decimal" ? "decimal" : "american");
el("odds-format").addEventListener("click", () => { setOddsFormat(state.oddsFormat === "decimal" ? "american" : "decimal"); render(); });
el("refresh").addEventListener("click", () => location.reload());
render();

</script>
</body>
</html>
