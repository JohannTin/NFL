<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TinAlgo · Week 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>:root {
  color-scheme: light;
  --ground: #f3f5f7; --surface: #fff; --surface-alt: #f8fafb;
  --ink: #192b3b; --ink-dim: #637383; --line: #e2e8ed;
  --accent: #315ad0; --accent-soft: #edf1ff; --sel: #edf1ff;
  --good: #16845b; --good-soft: #e7f5ee;
  --bad: #b2474c; --bad-soft: #faeded;
  --info: #315ad0; --info-soft: #f0f4fa;
  --range: #a3adb9; --track: #e9edf2; --model: #4265e8; --price: #b8801f;
  --shadow: 0 3px 18px #192b3b04;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #101820; --surface: #18232e; --surface-alt: #1d2a36;
  --ink: #e9eff5; --ink-dim: #a0afbe; --line: #2d3d4b;
  --accent: #9aafff; --accent-soft: #253657; --sel: #253657;
  --good: #55c99a; --good-soft: #1c3c32;
  --bad: #f19397; --bad-soft: #432d36;
  --info: #9aafff; --info-soft: #202f40;
  --range: #7e8e9e; --track: #31404d; --model: #a3b6ff; --price: #f0c05a;
  --shadow: none;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button, input, select { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 3px solid var(--accent); outline-offset: 3px;
}
button { color: inherit; }
button:disabled { cursor: default; opacity: .45; }
.app { max-width: 1520px; margin: 0 auto; padding: 0 32px 28px; }
.skip-link { position: fixed; top: -100px; left: 20px; z-index: 10; padding: 10px 16px; background: var(--surface); color: var(--accent); }
.skip-link:focus { top: 12px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 25px 0 23px; }
.brand { display: flex; align-items: center; gap: 13px; }
h1 { font-size: 21px; letter-spacing: -.6px; line-height: 1.2; margin: 0; font-weight: 600; }
.brand-sub { font-size: 11px; color: var(--ink-dim); letter-spacing: .07em; margin-top: 4px; }
.week-filter, .brand .mybook-select { display: flex; align-items: center; gap: 8px; padding-left: 15px; margin-left: 2px; border-left: 1px solid var(--line); }
.week-filter label, .brand .mybook-select label { font-size: 11px; color: var(--ink-dim); white-space: nowrap; }
.week-filter select, .brand .mybook-select select { font-size: 12px; padding: 6px 9px; }
.header-actions { display: flex; align-items: center; gap: 14px; }
.icon-button { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 38px; height: 38px; display: grid; place-items: center; }
.icon-button:hover { background: var(--accent-soft); }
.icon-button svg { width: 18px; height: 18px; }
.format-toggle { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; height: 38px; padding: 0 13px; font-size: 11px; font-weight: 600; color: var(--ink-dim); white-space: nowrap; }
.format-toggle:hover { background: var(--accent-soft); color: var(--ink); }
.format-toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.layout { display: grid; grid-template-columns: 258px minmax(0, 1fr); gap: 25px; align-items: start; }
.nav-panel { position: sticky; top: 20px; }
.nav-heading { display: flex; align-items: center; justify-content: space-between; margin: 0 2px 12px; }
.nav-heading label { font-size: 12px; font-weight: 600; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; color: var(--ink); padding: 7px 10px; font-size: 12px; }
.search-wrap { position: relative; margin-bottom: 12px; }
.search-wrap svg { position: absolute; top: 12px; left: 12px; width: 15px; height: 15px; color: var(--ink-dim); pointer-events: none; }
.searchbox { width: 100%; padding: 10px 32px 10px 35px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; font-size: 12px; }
.search-key { position: absolute; right: 12px; top: 10px; font-size: 11px; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 3px; width: 16px; text-align: center; }
.gamelist { display: flex; flex-direction: column; gap: 5px; max-height: calc(100vh - 200px); overflow-y: auto; scrollbar-width: thin; padding: 2px 4px 4px 2px; }
.date-group { padding: 14px 9px 5px; font-size: 10px; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; letter-spacing: .08em; }
.date-group:first-child { padding-top: 3px; }
.gamerow { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; border: 1px solid transparent; text-align: left; background: transparent; padding: 12px 10px; border-radius: 8px; }
.gamerow:hover { background: var(--surface); }
.gamerow.active { background: var(--sel); border-color: color-mix(in srgb, var(--accent) 25%, transparent); box-shadow: inset 3px 0 var(--accent); }
.gamerow .lbl { font-size: 13px; font-weight: 600; display: block; letter-spacing: .025em; }
.team-logo { width: 16px; height: 16px; object-fit: contain; vertical-align: -3px; margin-right: 4px; }
.gamehead h2 .team-logo { width: 30px; height: 30px; vertical-align: -6px; margin-right: 8px; }
.gamerow .at { color: var(--ink-dim); font-weight: 400; padding: 0 3px; }
.gamerow .sc { font-size: 10px; color: var(--ink-dim); white-space: nowrap; }
.nav-day { display: none; }
.detail { min-width: 0; }
.gamehead { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 16px; padding: 6px 0 22px; }
.eyebrow { font-size: 10px; letter-spacing: .1em; color: var(--ink-dim); font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
.gamehead h2 { font-size: clamp(21px, 2.2vw, 30px); letter-spacing: -.8px; font-weight: 600; line-height: 1.2; margin: 0; }
.gamehead h2 span { color: var(--ink-dim); font-weight: 400; font-size: .75em; margin: 0 6px; }
.sub { font-size: 12px; color: var(--ink-dim); margin-top: 9px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.metachip { font-size: 10px; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; color: var(--ink-dim); background: var(--surface); }
.section-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
.block { margin-bottom: 27px; }
h3.blocktitle { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -.15px; }
.section-heading .hint, .hint { font-size: 11px; color: var(--ink-dim); }
.legend-inline { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; font-size: 10px; color: var(--ink-dim); }
.legend-inline span { display: inline-flex; align-items: center; gap: 6px; }
.legend-line { width: 19px; height: 5px; border-radius: 5px; background: var(--range); }
.legend-line.sharp { background: var(--good); height: 3px; }
.legend-dot { width: 7px; height: 7px; background: var(--model); border-radius: 50%; }
.market-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.market-card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 18px 19px 14px; box-shadow: var(--shadow); }
.market-label { font-size: 11px; color: var(--ink-dim); display: flex; justify-content: space-between; gap: 8px; }
.market-value { font-size: 28px; line-height: 1.3; font-weight: 600; letter-spacing: -.7px; margin: 8px 0 2px; }
.market-value small { font-size: 11px; font-weight: 400; color: var(--ink-dim); letter-spacing: 0; margin-left: 7px; }
.market-description { font-size: 10px; color: var(--ink-dim); }
.range-svg { width: 100%; display: block; overflow: visible; }
/* One line, every row: a wrapped label made the rows under it different
   heights, so the column read as ragged rather than as a column. */
.range-labels { display: flex; flex-wrap: nowrap; justify-content: space-between; gap: 8px; font-size: 9px; color: var(--ink-dim); margin-top: 1px; }
.range-labels span { white-space: nowrap; }
.range-labels .sharp-text { color: var(--good); }
.range-meta { font-size: 10px; border-top: 1px solid var(--line); padding-top: 9px; margin-top: 10px; color: var(--ink-dim); display: flex; justify-content: space-between; gap: 5px; }
.model-text { color: var(--model); }
.model-status { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 7px; padding: 10px 0 0; font-size: 10px; color: var(--ink-dim); }
.tabs { display: flex; gap: 23px; border-bottom: 1px solid var(--line); margin: 24px 0 21px; }
.tab { border: 0; border-bottom: 2px solid transparent; background: transparent; font-size: 12px; font-weight: 500; padding: 0 0 12px; color: var(--ink-dim); }
.tab.active { color: var(--accent); border-color: var(--accent); }
.count { display: inline-block; margin-left: 5px; background: var(--track); border-radius: 4px; padding: 0 5px; font-size: 10px; color: var(--ink-dim); }
.tablewrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 620px; }
th { text-align: left; font-size: 9px; letter-spacing: .055em; text-transform: uppercase; color: var(--ink-dim); font-weight: 500; padding: 12px 15px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-alt); }
td { padding: 13px 15px; vertical-align: middle; }
tbody tr { border-bottom: 1px solid var(--line); }
tbody tr:last-child { border-bottom: 0; }
tbody tr:hover { background: var(--surface-alt); }
.pname { font-weight: 500; font-size: 12px; }
.c-player { display: flex; flex-direction: column; gap: 3px; white-space: nowrap; }
.nbooks { font-size: 10px; color: var(--ink-dim); font-weight: 400; display: block; }
.c-num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.c-num.strong { font-weight: 600; }
.sharp-badge { display: inline-block; color: var(--good); background: var(--good-soft); font-size: 8px; font-weight: 500; border-radius: 4px; padding: 2px 5px; margin-left: 5px; vertical-align: 1px; }
/* Game lines, the props board and the per-book rows under it all print a
   price with this one mark, so the same number reads the same on every tab. */
/* Prices carry the same monospace as every other figure on the board, so a
   price column lines up with a percentage column digit for digit. */
.odds, .ou-price { display: inline-block; min-width: 2.9rem; text-align: left; color: var(--price);
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 600;
  font-variant-numeric: tabular-nums; }
.odds.best { color: var(--good); background: var(--good-soft); border-radius: 4px; padding: 1px 5px; }
.odds.empty { color: var(--ink-dim); font-weight: 400; }
.odds-tag { color: var(--ink-dim); font-weight: 400; margin-right: 4px; }
.odds.best .odds-tag { color: var(--good); }
.team-accent { height: 4px; border-radius: 3px; margin-bottom: 14px; opacity: .9; }
.mkt-head td { background: var(--surface-alt); color: var(--ink-dim); font-size: 10px; font-weight: 500; padding: 10px 15px; }
.marketchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 15px; }
.mchip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-dim); border-radius: 6px; padding: 6px 9px; font-size: 10px; }
.mchip:hover { border-color: var(--accent); }
.mchip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.props-table { min-width: 810px; }
.props-table .c-bar { min-width: 215px; width: 26%; }
.line-range { min-width: 100px; max-width: 125px; margin-left: auto; }
.line-range .range-labels { justify-content: flex-end; font-family: "IBM Plex Sans", sans-serif; }
.line-range svg { height: 23px; }
.bookrow td { background: var(--surface-alt); padding-top: 8px; padding-bottom: 8px; font-size: 11px; }
.bookrow .bookname { padding-left: 28px; }
.bookrow.samebook td { padding-top: 4px; padding-bottom: 4px; }
.bookrow.samebook .bookname { padding-left: 44px; }
.model-note td { color: var(--model); background: var(--accent-soft); font-size: 10px; padding: 9px 15px; }
.altline { display: inline-block; color: var(--ink-dim); background: var(--track); font-size: 8px; font-weight: 500; border-radius: 4px; padding: 2px 5px; margin-left: 5px; vertical-align: 1px; }
.expand { background: transparent; color: var(--accent); border: 1px solid var(--line); border-radius: 6px; font-size: 10px; padding: 5px 7px; white-space: nowrap; }
.playerrow.open { background: var(--accent-soft); }
.movegrid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: center; }
.chartcard { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 18px; box-shadow: var(--shadow); }
.chartcard svg { display: block; width: 100%; height: auto; }
.movetable { min-width: 0; }
.movetable th, .movetable td { padding: 10px 12px; text-align: right; }
.movetable th:first-child, .movetable td:first-child { text-align: left; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
.controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
input.filter { flex: 1; min-width: 160px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 10px; font-size: 12px; }
.loglines { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; max-height: 560px; overflow: auto; box-shadow: var(--shadow); }
.logline { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 6px 0; border-bottom: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.logline.ERROR { color: var(--bad); }
.pill { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 500; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--info-soft); color: var(--info); }
.nodata, .empty-note { padding: 28px 18px; color: var(--ink-dim); font-size: 12px; text-align: center; }
.nodata { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.nodata strong { display: block; color: var(--ink); margin-bottom: 5px; font-weight: 500; }
footer { color: var(--ink-dim); font-size: 10px; display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }
@media (max-width: 1150px) {
  .app { padding: 0 22px 24px; } .layout { grid-template-columns: 224px minmax(0, 1fr); gap: 20px; }
  .market-card { padding: 15px 13px; } .market-value { font-size: 25px; }
  .range-meta { flex-wrap: wrap; } .movegrid { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .app { padding: 0 18px 24px; } .layout { grid-template-columns: 1fr; gap: 22px; }
  .nav-panel { position: static; }
  .gamelist { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); max-height: 230px; gap: 5px; }
  .date-group { grid-column: 1 / -1; padding-top: 10px; } .gamerow { background: var(--surface); }
  .gamerow .sc { font-size: 9px; }
}
@media (max-width: 560px) {
  .app { padding: 0 14px 20px; } .top { padding: 20px 0; flex-wrap: wrap; } h1 { font-size: 19px; }
  .brand { gap: 9px; }
  .brand-sub { font-size: 9px; } .header-actions { gap: 7px; }
  .week-filter, .brand .mybook-select { padding-left: 9px; }
  .week-filter label, .brand .mybook-select label { display: none; }
  .gamelist { grid-template-columns: repeat(2, minmax(0, 1fr)); max-height: 156px; }
  .date-group { display: none; }
  .gamerow { padding: 10px 8px; } .gamerow .lbl { font-size: 12px; } .gamerow .sc { font-size: 8px; }
  .nav-day { display: block; font-size: 8px; text-align: right; margin-bottom: 3px; }
  .market-grid { grid-template-columns: 1fr; gap: 9px; }
  .market-card { display: grid; grid-template-columns: 105px minmax(0, 1fr); gap: 0 14px; padding: 15px; }
  .market-card .range-plot { grid-column: 2; grid-row: 1 / 4; align-self: center; }
  .market-card .market-label { grid-column: 1; } .market-value { grid-column: 1; margin: 3px 0; }
  .market-description { grid-column: 1; } .range-meta { grid-column: 1 / -1; }
  .legend-inline { gap: 11px; } .gamehead { padding-bottom: 18px; }
  .gamehead h2 { font-size: 23px; } .sub { font-size: 11px; }
  .section-heading { gap: 8px; } .tabs { gap: 20px; }
  .tab { font-size: 11px; } .count { margin-left: 3px; }
  .props-table, .props-table tbody { display: block; width: 100%; min-width: 0; }
  .props-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .props-table .mkt-head, .props-table .mkt-head td { display: block; }
  .props-table .playerrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; padding: 16px; }
  .props-table .playerrow td { display: block; padding: 0; text-align: left; }
  .props-table .playerrow td, .props-table .bookrow td { border-left: 0; }
  .props-table .playerrow td:first-child { grid-column: 1 / -1; }
  .props-table .playerrow td[data-label]::before { content: attr(data-label); display: block; color: var(--ink-dim); font: 9px "IBM Plex Sans", sans-serif; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .045em; }
  .props-table .playerrow .pname { font-size: 14px; }
  .props-table .playerrow .c-bar { grid-column: 1 / -1; min-width: 0; width: auto; }
  .props-table .playerrow td:last-child { text-align: right; align-self: center; }
  .props-table .line-range { margin-left: 0; }
  .props-table .line-range .range-labels { justify-content: flex-start; }
  .props-table .bookrow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; padding: 12px 16px; background: var(--surface-alt); }
  .props-table .bookrow td { display: block; padding: 0; text-align: left; }
  .props-table .bookrow .bookname, .props-table .bookrow td:last-child { grid-column: 1 / -1; }
  .props-table .model-note, .props-table .model-note td { display: block; }
}

/* --- primary book -------------------------------------------------------
   The book actually being bet is pinned to the top of every book list and
   marked, so "my price" is never confused with "the market's price". */
.primary-badge {
  display: inline-block; margin-left: .4rem; padding: .05rem .3rem;
  border-radius: 4px; font-size: .62rem; font-weight: 700; letter-spacing: .03em;
  vertical-align: middle; background: var(--accent, #1f6feb); color: #fff;
}
tr.primary-book { background: color-mix(in srgb, var(--accent, #1f6feb) 7%, transparent); }
tr.primary-book td { font-weight: 600; }

/* --- model edges --------------------------------------------------------- */
.edge-ev { font-weight: 700; color: var(--good, #2ea043); }
/* Why an offer over the floor was not taken, on the row that raises the
   question. */
.pick-note { display: block; font-weight: 400; font-size: 9px; color: var(--ink-dim);
  font-family: "IBM Plex Sans", sans-serif; letter-spacing: 0; margin-top: 2px; }
tr.edge-pick { background: color-mix(in srgb, var(--good, #2ea043) 8%, transparent); }
.edges-table { table-layout: fixed; min-width: 720px; }
.edges-table th:first-child { width: 22%; }
.edges-table th:nth-child(2) { width: 20%; }
.edges-table th:nth-child(3) { width: 12%; }
.edges-table th:nth-child(4) { width: 16%; }
.edges-table th:nth-child(n+5) { width: 10%; }
.edges-table td { overflow-wrap: anywhere; }
.edges-table .edge-ev, .edges-table .odds { white-space: nowrap; }
.edges-table .pick-note { white-space: normal; }
.edges-table .edge-review td { padding: 0 14px 14px; text-align: left; }
.edges-table .edge-review p { margin: 0; color: var(--ink-dim); font-size: 12px;
  font-weight: 400; line-height: 1.65; white-space: normal; letter-spacing: 0; }
@media (max-width: 760px) {
  .edges-table, .edges-table tbody { display: block; min-width: 0; width: 100%; }
  .edges-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .edges-table tr:not(.edge-review) { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 12px; gap: 10px; border-top: 1px solid var(--line); }
  .edges-table tr:not(.edge-review) td { display: block; padding: 0; border: 0; text-align: left; min-width: 0; }
  .edges-table tr:not(.edge-review) td:first-child { grid-column: 1 / -1; }
  .edges-table tr:not(.edge-review) td:nth-child(5)::before { content: 'Odds'; }
  .edges-table tr:not(.edge-review) td:nth-child(6)::before { content: 'Model'; }
  .edges-table tr:not(.edge-review) td:nth-child(7)::before { content: 'EV'; }
  .edges-table tr:not(.edge-review) td:nth-child(n+5)::before { display: block; font-size: 10px; font-weight: 400; color: var(--ink-dim); margin-bottom: 4px; }
  .edges-table .edge-review, .edges-table .edge-review td { display: block; }
  .edges-table .edge-review td { border: 0; padding: 0 12px 14px; }
}
.approx { color: var(--muted, #8b949e); font-weight: 600; margin-left: .15rem; cursor: help; }

/* --- props: my-book pricing ---------------------------------------------- */
.propcontrols { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
  justify-content: space-between; margin: 0 0 12px; }

/* Fixed column widths so every line and price sits on the same vertical rule
   down the whole table, and the two sides stay mirror images of each other. */
.props-table col.c-player { width: auto; }
.props-table thead th:nth-child(2) { width: 10.5rem; }                 /* line / range */
.props-table th.ou-head, .props-table td.ou-cell { width: 7.75rem; }   /* over, under  */
.props-table thead th:nth-child(5), .props-table thead th:nth-child(6) { width: 4.75rem; }
.props-table thead th:nth-child(7) { width: 14rem; }                   /* prob range   */
.props-table th.ou-expand, .props-table td.ou-expand { width: 3.75rem; }

/* Game lines runs on the same geometry, so a book's price sits in the same
   place on both tabs and the two boards can be read against each other. */
.lines-table { table-layout: fixed; width: 100%; min-width: 720px; }
.lines-table th:first-child { width: auto; }
.lines-table th.ou-head, .lines-table td.ou-cell { width: 7.75rem; }
.lines-table thead th:nth-child(7) { width: 6.25rem; }

.lines-table .ou-head, .lines-table .ou-cell { border-left: 0; }

/* The only rules on the board fence off the prices: player, then over, then

  border-left: 1px solid var(--line); }

.ou-in { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; width: 100%; }

lt, not by workload.", "body": ["Seattle's backfield emptied out over one offseason. Kenneth Walker III, the Super Bowl LX MVP, signed in Kansas City. Zach Charbonnet tore an ACL in the Divisional Round against San Francisco, had surgery in February and went on the reserve/PUP list on August 30, which rules him out through Week 4 at the earliest. That is how Price, the 32nd pick of the 2026 draft, ends up starting an opener.", "\"Lead back\" is doing a lot of work in that sentence. George Holani is reported to be in line for a heavy dose of touches and free-agent addition Emanuel Wilson is the third body. A three-way rotation is the normal shape of a Week 1 backfield for a coaching staff that has not seen its rookie take a live snap: Price sat out every preseason game with a minor leg issue and, in his own words, has not played since November. Mike Macdonald's framing for the week was that Price would get \"his first NFL carry at some point,\" which is not the language of a 20-touch plan.", "The opponent argues the same way. New England allowed 3.1 yards per carry across its playoff run, lower than any Super Bowl team in the previous four years, and no opposing running back cleared 50 rushing yards against it through the first nine weeks of 2025. Milton Williams and Christian Barmore are the reason. Carry counts are not fixed before kickoff; they are the running total of a coordinator's willingness to keep calling runs, and a front that wins early downs is how that willingness gets spent.", "The market's own number sits at 13.5 with the under at -135, an implied 57.4%. The model has it at 59.7%. That is a small edge on a price that already leans the right way, which is what a one-unit stake reflects."]}, "Jaxon Smith-Njigba|player_receptions|6.5|under|betmgm": {"angle": "The line is set at his mean, and the one corner who has solved him is across from him again.", "body": ["Smith-Njigba caught 119 passes in 17 games last season on a league-high 36% target share, won Offensive Player of the Year and led the NFL in receiving yards. That is exactly 7.0 receptions per game, so 6.5 is a number placed on top of his average rather than under it. There is no soft side to buy here on reputation.", "The reason to take the under is the specific opponent. Christian Gonzalez shadowed him in Super Bowl LX seven months ago and held him to 4 catches on 10 targets for 27 yards, with Pro Football Focus charging Gonzalez one reception on five targets and crediting him with three pass breakups. Carlton Davis described the plan plainly beforehand: Gonzo follows him, and motion buys a few looks against someone else. New England then paid Gonzalez $135 million over four years. The game plan that worked is still on the roster and still healthy.", "Volume is the second argument. Seattle threw at the third-lowest rate in the league last season and ranked 26th in neutral pass rate at 49.0%. Klint Kubiak left for Las Vegas and Brian Fleury is expected to run much of the same offense, so the low-pass-rate baseline carries forward. A 44.5-point total is among the lower ones on the Week 1 board, and receptions are a play-count statistic before they are a talent statistic.", "This is the thinner of the two. At -110 the market is near a coin flip and the model's 53.9% barely improves on it. Smith-Njigba only has to catch seven, and a 36% target share means one 35-attempt game gets him there without anything unusual happening."]}}, "research_picks": [], "sections": [{"title": "How the two fit together", "body": ["Two unders on the same offense reads like one bet placed twice. On game script it is closer to the opposite. If Seattle builds a lead, the run game closes the game out and Price's carry count climbs toward 14 while Darnold throws less and Smith-Njigba's receptions stall. If Seattle trails, the runs disappear early and Price's under is safe, but the pass volume that beats 6.5 receptions shows up. The scripts that hurt one pick tend to help the other.", "What the two do share is Seattle's total play count and how concentrated its touches are. Both lose together in a normal-script game with enough snaps to support a 14-carry rookie and a seven-catch receiver at the same time. A 44.5 total and the league's third-lowest pass rate are the case against that game existing. Both win together in the low-volume, committee-backfield, Gonzalez-erases-the-star version, which is the same thesis stated twice.", "So the honest framing is not two independent one-unit bets. It is a two-unit position that Seattle's individual touch counts come in under the market's central case, hedged on direction and exposed on pace."]}, {"title": "What beats this card", "body": ["Price takes the job outright. A first-round back who breaks one early gets fed, and \"Price clears 100 yards and locks down the lead role\" is a prediction that was published this week by people who watched camp. Fourteen carries is not a high bar for a starting running back on a favorite.", "New England's front is not at full strength. Harold Landry III is on PUP and Christian Barmore did not practice on the most recent report. A slower pass rush means longer plays and more of the short-area volume that Smith-Njigba turns into receptions even on a day when the deep shots are covered.", "Both picks live at BetMGM, not at bet365, and the two have very different amounts of room. The rush attempts under stays worth betting down to about -148, so a few cents of movement does not kill it. The receptions under breaks even at -117 and BetMGM's -110 was the only price on the board above fair: every other book was already at -119 or worse. That pick is a single-book outlier, not a market-wide read, and it stops being a bet the moment the outlier closes."]}], "sources": [{"label": "Seahawks.com: Jadarian Price to get first NFL action in Week 1", "url": "https://www.seahawks.com/news/jadarian-price-to-get-first-nfl-action-in-week-1"}, {"label": "NFL.com: Macdonald on Charbonnet's  null, "pick_note": "", "translated": true, "updated": "2026-09-11T00:03:32Z"}, {"game_id": "2026_01_SF_LA", "player": "Blake Corum", "market": "player_reception_yds", "point": 2.5, "side": "over", "book": "fanduel", "odds": 102.0, "p_model": 0.4967012306503386, "ev": 0.003336485913683962, "pick_grade": false, "stake": null, "pick_note": "", "translated": false, "updated": "2026-09-11T00:03:32Z"}, {"game_id": "2026_01_SF_LA", "player": "Terrance Ferguson", "market": "player_reception_yds", "point": 24.5, "side": "under", "book": "fanduel", "odds": -113.0, "p_model": 0.5311902803868741, "ev": 0.0012701745345502502, "pick_grade": false, "stake": null, "pick_note": "", "translated": false, "updated": "2026-09-11T00:03:32Z"}, {"game_id": "2026_01_SF_LA", "player": "Terrance Ferguson", "market": "player_reception_yds", "point": 24.5, "side": "under", "book": "betrivers", "odds": -113.0, "p_model": 0.5311902803868741, "ev": 0.0012701745345502502, "pick_grade": false, "stake": null, "pick_note": "", "translated": false, "updated": "2026-09-11T00:03:32Z"}], "coach_review": null, "prop_movement": [], "writeup": {"headline": "Three unders on volume the market hasn't quite caught up to", "standfirst": "LA opens as a 3.5-point home favorite over San Francisco with a 48-point total. All three offers here bet against an individual touch or catch count, not against either team winning, and none of them need the game script to break a particular way.", "written_at": "2026-09-11T00:10:00Z", "stale": "", "picks": {"Blake Corum|player_rush_attempts|10.5|under|bet365": {"angle": "The lead back plays 30 feet away from him and gets the ball near the goal line.", "body": ["Kyren Williams is still the Rams' workhorse. He is drawing roughly half of LA's carries this season, about 15 a game on a 49.6% share, and he owns the red zone almost outright: 63% of the team's carries inside the 20 have gone to him. Corum's role is real but clearly secondary, a 34.5% share worth about 10.25 attempts a game, and a red-zone share, 15.8%, nowhere near Williams'.", "That trailing pace sits almost exactly on the market's 10.5 line, which is the point. The number is not asking Corum for less than he has been doing; it is asking him for what he has already been doing.", "The team-level math does not open a path higher, either. LA throws on about 57% of its snaps, and the two backs combine for under 30 carries a game between them. Even if the Rams lean on the run some as home favorites, Williams is first in line for the extra work, especially near the end zone.", "Bet365's under is -111, an implied 52.6%, against a model read of 53.7%. That clears the vig without much room to spare, worth it down to about -116."]}, "Jordan Whittington|player_receptions|0.5|under|betmgm": {"angle": "A zero-catch game is a live outcome the market is pricing a little too cheap.", "body": ["Whittington's usage so far this season is thin enough that he does not clear the model's own eligibility bar for a fundamental, usage-based read, so this is a market-consensus play rather than a role-confirmed one: no route or target data of his own is backing the number, only what the sharp books say about the exact 0.5 line.", "That sharp-book consensus puts his chance of catching at least one pass at roughly 61%, which leaves about 39% for a scoreless target day. BetMGM's under prices that outcome at +165, an implied 37.7%, so the offered price is a little behind the model's own number.", "The gap is not large, and this is the more speculative of the three offers here precisely because there is no player-specific trend confirming it. It is a bet on the market's own math, not on anything seen in Whittington's usage."]}, "Tyler Higbee|player_reception_yds|16.5|under|fanduel": {"angle": "The model reads a diminished role; a decade of tape argues the other way.", "body": ["Higbee is currently the Rams' second tight end by depth chart, playing about 36% of the offensive snaps with a 7.8% target share, well short of a featured role. On that usage, an under on 16.5 receiving yards is a straightforward read.", "Fanduel has it at -113, an implied 53.0%, against a model number of 54.8%, enough edge to clear the vig at that price."]}}, "research_picks": [], "sections": [{"title": "What we like less", "body": ["The Higbee pick is the one worth a second thought before betting it. Ten years in the league is a long track record of exactly the kind of catch-and-run that turns a quiet role into a 20-yard gain on one play, and a part-time snap count does not remove that from his game the way it would for a player who has never shown it. The model is reading his current usage correctly; it is not, and cannot, read the chance that one veteran catches a defense sleeping.", "Corum's and Whittington's numbers depend on backfield and receiver-room shares holding roughly where they have been. A shift in either, an injury, a bigger role handed out in practice, moves both lines before kickoff, which is the ordinary risk of any usage-based prop and not specific to this card.", "Those reservations are why only the Corum leg got bet. Higbee's veteran big-play risk and Whittington's thin, unconfirmed usage were enough to pass on both, even though the model cleared its EV floor on all three."]}], "sources": []}, "picks_status": null}, {"game_id": "2026_01_ATL_PIT", "season": 2026, "week": 1, "home_abbr": "PIT", "away_abbr": "ATL", "kickoff": "2026-09-13T17:00:00Z", "id": "2026_01_ATL_PIT", "home": "Pittsburgh Steelers", "away": "Atlanta Falcons", "label": "ATL @ PIT", "snapshots": 0, "first_seen": null, "last_seen": null, "lines": [], "consensus": {"books": 0, "spread_home": null, "total": null, "p_home": null, "p_books": 0}, "movement": [], "props": {}, "model": null, "edges": [{"game_id": "2026_01_ATL_PIT", "player": "Drake London", "market": "player_receptions", "point": 4.5, "side": "under", "book": "betmgm", "odds": 140.0, "p_model": 0.4414518715958434, "ev": 0.05948449183002413, "pick_gr un defense is real, but the model edge is small and Kansas City previews point toward needing a serious rushing commitment to keep Mahomes out of long passing downs.", "translated": false, "updated": "2026-09-14T20:30:00Z", "model_pick_grade": false, "coach_reviewed": true}, {"game_id": "2026_01_DEN_KC", "player": "Travis Kelce", "market": "player_receptions", "point": 4.5, "side": "under", "book": "bovada", "odds": -150.0, "p_model": 0.605, "ev": 0.008, "pick_grade": false, "stake": null, "pick_note": "Travis Kelce under 4.5 catches at Bovada: pass. It is a worse version of the bet365 Kelce price, and the football concern is the same: Kelce can be the quick-game pressure valve.", "translated": false, "updated": "2026-09-14T20:30:00Z", "model_pick_grade": false, "coach_reviewed": true}, {"game_id": "2026_01_DEN_KC", "player": "Jaylen Waddle", "market": "player_reception_yds", "point": 58.5, "side": "under", "book": "bovada", "odds": -105.0, "p_model": 0.516, "ev": 0.0078, "pick_grade": false, "stake": null, "pick_note": "Jaylen Waddle under 58.5 receiving yards at Bovada: pass. This is a tiny edge against a player Denver added to change coverage and attack vertically. His intended field-stretcher role makes the small under edge less compelling.", "translated": false, "updated": "2026-09-14T20:30:00Z", "model_pick_grade": false, "coach_reviewed": true}, {"game_id": "2026_01_DEN_KC", "player": "Jaylen Waddle", "market": "player_receptions", "point": 4.5, "side": "under", "book": "fanduel", "odds": -104.0, "p_model": 0.513, "ev": 0.0065, "pick_grade": false, "stake": null, "pick_note": "Jaylen Waddle under 4.5 catches at FanDuel: pass. The edge is too small, and the role is too central to Denver's opener.", "translated": false, "updated": "2026-09-14T20:30:00Z", "model_pick_grade": false, "coach_reviewed": true}, {"game_id": "2026_01_DEN_KC", "player": "Adam Trautman", "market": "player_receptions", "point": 0.5, "side": "under", "book": "draftkings", "odds": 185.0, "p_model": 0.352, "ev": 0.0032, "pick_grade": false, "stake": null, "pick_note": "Adam Trautman under 0.5 catches at DraftKings: pass. Engram starting keeps the zero-catch path live, but Trautman only needs one leak-out or protection-release target to beat it, and the edge is essentially flat.", "translated": false, "updated": "2026-09-14T20:30:00Z", "model_pick_grade": false, "coach_reviewed": true}, {"game_id": "2026_01_DEN_KC", "player": "Adam Trautman", "market": "player_receptions", "point": 0.5, "side": "under", "book": "bovada", "odds": 185.0, "p_model": 0.352, "ev": 0.0032, "pick_grade": false, "stake": null, "pick_note": "Adam Trautman under 0.5 catches at Bovada: pass. Same read as DraftKings: the plus price offers little margin, and the model edge is not enough to justify a zero-catch requirement.", "translated": false, "updated": "2026-09-14T20:30:00Z", "model_pick_grade": false, "coach_reviewed": true}, {"game_id": "2026_01_DEN_KC", "player": "Xavier Worthy", "market": "player_receptions", "point": 3.5, "side": "under", "book": "draftkings", "odds": -146.0, "p_model": 0.594, "ev": 0.0012, "pick_grade": false, "stake": null, "pick_note": "Xavier Worthy under 3.5 catches at DraftKings: pass only because bet365 has the better selected version. The football case is good, but the DraftKings price has almost no EV left.", "translated": false, "updated": "2026-09-14T20:30:00Z", "model_pick_grade": false, "coach_reviewed": true}], "coach_review": {"stale": "", "reviewed_at": "2026-09-14T20:35:00Z", "offers_reviewed": 16}, "prop_movement": [], "writeup": {"headline": "Three reception unders built around receiver roles", "standfirst": "Kansas City opens at home with Mahomes coming off the ACL, a shaky tackle setup and a game plan that should protect him. Worthy and Thornton's vertical roles support their reception unders, while Pat Bryant faces a crowded Denver target hierarchy.", "written_at": "2026-09-14T20:35:00Z", "stale": "", "picks": {"Xavier Worthy|player_receptions|3.5|under|bet365": {"angle": "The number needs a four-catch game from a vertical receiver against Denver's best defensive unit.", "body": ["Worthy is the strongest selection on the board because the model edge also lines up with the game shape. Kansas City is expected to make the plan easy on Mahomes in his first regular-season game back from the ACL, and the preview context points toward protection help, run action and short completions rather than a full passing-volume opener.", "Worthy can beat this with one designed screen plus a couple of quick throws, but his best value is still speed and space. Denver was a top-seven pass defense last season, and the same matchup twice last year produced three catches and then zero for Worthy. At 3.5, the under is not asking him to disappear; it only needs him to stay out of the four-catch possession-receiver lane.", "Bet365's -135 price implies 57.4%. The model has the under at 59.4%, which leaves the best bet365 edge in the 16-offer board."]}, "Tyquan Thornton|player_receptions|1.5|under|bet365": {"angle": "His production is explosive, not catch-count driven.", "body": ["Thornton is exactly the kind of player who makes an under feel uncomfortable because one target can turn into a big play. That is a yardage or touchdown problem more than a receptions problem. His 2025 profile was 19 catches for 438 yards, a 23.0-yard average, and his game log had plenty of one-catch or zero-catch outcomes mixed with a few spike games.", "That role matters against this opponent. Denver's pass rush can force Kansas City to keep extra bodies in, and a protection-first plan usually does not create extra underneath layups for the second speed receiver. If Thornton is used to stretch the defense, two catches still require more than one successful shot.", "At -141, the break-even probability is 58.5%. The model has the under at 59.8%, leaving a modest positive edge at bet365. DraftKings offers the same under at a slightly better -139."]}, "Pat Bryant|player_receptions|2.5|under|fanduel": {"angle": "A crowded target hierarchy makes three catches a demanding threshold.", "body": ["Denver's unofficial Week 1 chart lists Jaylen Waddle, Marvin Mims and Courtland Sutton as the starters, with Bryant behind Sutton. The same depth-chart report says Bryant should still be involved, but involvement from the fourth receiver is different from needing three catches.", "His 2025 usage supports the caution. Bryant finished with 31 catches in 15 games and reached three receptions in only four of those appearances. Waddle arriving adds another real target earner to a room that already has Sutton and Mims, so Bryant's path is narrower than last year's late-season box scores.", "FanDuel's -122 price requires a 55.0% hit rate. The model has the under at 55.8%, with a reported +1.61% EV. The edge is modest, but the depth chart and historical catch counts support the same direction."]}}, "research_picks": [], "sections": [{"title": "Why not the other bigger names", "body": ["The board is mostly unders, but the receiver roles do not support every fade equally. Waddle is a new starting piece in Denver's offense, and local preview work specifically frames him as a player who can stress Kansas City's secondary. The model has small positive prices on his unders, but the football role points the other way.", "Kelce is closer. The model says under 4.5, and the age curve is the obvious reason. The problem is how Kansas City probably has to play this game: Mahomes is coming off the ACL, Denver can rush, and the tackles need help. That setup creates quick throws, tight-end chips and release routes. Kelce may no longer be a seven-catch default, but his short-area role makes -147 a demanding price on him staying below five.", "Walker's unders also face game-plan concerns. Denver's front is excellent, but Kansas City's own game-plan previews call for a real rushing commitment and describe Walker as a featured debut piece. His receptions under is especially fragile because pressure games can turn backs into outlets."]}, {"title": "Card shape", "body": ["Worthy under 3.5 and Thornton under 1.5 are related because both depend on Kansas City not turning this into a high-volume wide-receiver game, but they attack different roles: Worthy at a four-catch threshold, Thornton at a two-catch threshold.", "Bryant under 2.5 rests on Denver's target distribution. Waddle, Sutton and Mims lead the starting receiver group, leaving Bryant a narrower path to three catches."]}], "sources": [{"label": "Mile High Report: Broncos unofficial Week 1 depth chart", "url": "https://www.milehighreport.com/denver-broncos-news/184524/broncos-unofficial-depth-chart-week-1-chiefs-2026"}, {"label": "Arrowhead Pride: Chiefs-Broncos Week 1 things to watch", "url": "https://www.arrowheadpride.com/kansas-city-chiefs-analysis/209688/chiefs-broncos-5-things-watch-week-one-matchup"}, {"label": "Arrowhead Pride: Chiefs keys against Denver", "url": "https://www.arrowheadpride.com/kansas-city-chiefs-analysis/209874/kingdom-keys-3-keys-chiefs-victory-over-the-broncos-in-week-1"}, {"label": "Mile High Report: Broncos at Chiefs preview", "url": "https://www.milehighreport.com/denver-broncos-news/184490/broncos-at-chiefs-preview-denver-aims-for-fast-start"}, {"label": "NFL.com: Xavier Worthy 2025 game log", "url": "https://www.nfl.com/players/xavier-worthy/stats/logs/2025/"}, {"label": "NFL.com: Tyquan Thornton 2025 game log", "url": "https://www.nfl.com/players/tyquan-thornton/stats/logs/2025/"}, {"label": "DenverBroncos.com: Pat Bryant career stats", "url": "https://www.denverbroncos.com/team/players-roster/pat-bryant/career"}]}, "picks_status": null}, {"id": "56e8897681915f7ec92baeee952bb1ae", "home": "Buffalo Bills", "away": "Detroit Lions", "home_abbr": "BUF", "away_abbr": "DET", "label": "DET @ BUF", "kickoff": "2026-09-18T00:15:00Z", "snapshots": 13, "first_seen": "2026-09-17T09:00:02Z", "last_seen": "2026-09-18T00:00:02Z", "lines":
